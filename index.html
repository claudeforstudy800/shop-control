<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Control</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14213d;--mute:#5b6678;--line:#dde3ea;--g:#16794a;--gb:#e3f4ea;--y:#9a6700;--yb:#fff3cd;--r:#b3261e;--rb:#fde7e5;--ac:#14213d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#18202f;--ink:#e8edf5;--mute:#9aa6ba;--line:#2a3548;--g:#5fd39a;--gb:#12301f;--y:#f2c55c;--yb:#3a2f0e;--r:#ff8a80;--rb:#3d1815;--ac:#e8edf5}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Hind,system-ui,sans-serif;font-size:16px;padding-bottom:84px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:18px}
select,input,textarea,button{font:inherit;color:inherit}
.who{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)}
main{max-width:680px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.big{font-size:30px;font-weight:700}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:14px}
.G{background:var(--gb);color:var(--g)}.Y{background:var(--yb);color:var(--y)}.R{background:var(--rb);color:var(--r)}
.act{padding:10px 12px;border-radius:8px;margin-bottom:6px;font-weight:500}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,textarea,select.f{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:17px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.p{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--ac);color:var(--card);font-weight:700;font-size:17px}
button.s{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.err{color:var(--r);font-weight:500;margin-top:8px}.muted{color:var(--mute);font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;overflow-x:auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 auto;white-space:nowrap;padding:14px 10px;font-size:13px;border:0;background:none;font-weight:500;color:var(--mute)}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
.qb{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qb button{padding:10px}
.th{width:44px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:8px}.th.bg{position:fixed;inset:10% 5%;width:90%;height:80%;object-fit:contain;background:#000;z-index:20;margin:0}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px}.wa{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:10px;background:var(--g);color:var(--card);font-weight:700;margin-top:10px}.wa.sm{display:inline-block;padding:6px 12px;margin:0}
.tb{border-collapse:collapse;font-size:14px;width:100%}.tb th,.tb td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}.tb th:first-child,.tb td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.kpi{background:var(--bg);border-radius:8px;padding:10px}.kpi .big{font-size:22px}
.calc{background:var(--bg);border-radius:8px;padding:10px;margin-top:12px}
</style></head><body>
<header><b id="shop">Shop Control</b><span><span class="pill Y" id="sync" role="button" tabindex="0">Connecting…</span> <span class="muted" id="who"></span></span></header>
<main id="v"></main><nav id="nav"></nav>
<script>
const K='shopctl1';
const D0={set:{name:'My Shop',xr:1,payT:100,xT:10,dem1:5,dem2:10,close:'21:00',cash0:0,cashT:100,v1:100,v2:500,expD:3,open:'09:00',grace:10,lateN:3,demT:0.5,inc1:90,inc2:80,inc3:70,prT:10,spT:20,deadD:60,slowD:30},prod:[],closings:{},demand:[]};
let S=D0;
S.money=S.money||[];S.cats=S.cats||[];S.bills=S.bills||[];S.set.waMin=S.set.waMin||50;
const normP=p=>({code:'',cat:'',brand:'',unit:'Piece',pr:0,mrp:0,sr:0,min:0,open:p.stock||0,sup:'',fast:false,bt:false,oc:0,active:true,cd:0,ud:0,...p});S.prod=S.prod.map(normP);S.slog=S.slog||[];S.purch=S.purch||[];S.spay=S.spay||[];S.emp=S.emp||[];S.roster=S.roster||[];S.att=S.att||[];S.leaves=S.leaves||[];S.ldec=S.ldec||[];S.compl=S.compl||[];S.sal=S.sal||[];S.sadj=S.sadj||[];S.devs=S.devs||[];S.audit=S.audit||[];S.ral=S.ral||[];S.sts=S.sts||[];
const save=()=>{};
const $=id=>document.getElementById(id);
let DB=null,ADM=false,dirty=false,AUTH=0,UID='';const WHO=()=>ADM?'OWNER':'EMP-'+UID.slice(-6);
const Q={},FAIL={};let pend=0,LIVE=false;
function stat(){const e=$('sync');if(!e)return;const f=Object.keys(FAIL).length;e.className='pill '+(f?'R':pend||!LIVE?'Y':'G');e.textContent=f?'Not saved · tap to retry':pend?'Saving…':LIVE?'Synced':'Connecting…';e.onclick=f?retry:null}
function retry(){Object.keys(FAIL).forEach(p=>{const b=FAIL[p];delete FAIL[p];wr(p,b)})}
function wr(p,o){const b=JSON.parse(JSON.stringify(o));pend++;stat();Q[p]=(Q[p]||Promise.resolve()).then(()=>DB.doc(p).set(b)).then(()=>{delete FAIL[p]},err=>{FAIL[p]=b;console.error(p,err)}).then(()=>{pend--;stat()})}
const put=(p,o)=>{if(!DB)return;if(p.startsWith('products/')){const{stock,...r}=o;wr(p,r);wr('catalog/'+o.id,{id:o.id,name:o.name,code:o.code,sr:o.sr,unit:o.unit,active:o.active})}else if(p.startsWith('emp/')){wr(p,o);wr('roster/'+o.id,{id:o.id,name:o.name,uid:o.uid,wo:o.wo,ss:o.ss,se:o.se,active:o.active})}else wr(p,o)};
function patch(p,part,full){if(!DB)return;const b=JSON.parse(JSON.stringify(part)),fl=JSON.parse(JSON.stringify(full));pend++;stat();Q[p]=(Q[p]||Promise.resolve()).then(()=>DB.doc(p).update(b).catch(()=>DB.doc(p).set(fl))).then(()=>{delete FAIL[p]},err=>{FAIL[p]=fl;console.error(p,err)}).then(()=>{pend--;stat()})}
const del=p=>{if(DB)DB.doc(p).delete().catch(()=>{})};
async function connect(){try{const u=await claude.use('user');DB=await claude.use('db');if(!DB||!u){DB=null;AUTH=2;render();return}
 ADM=await u.canEdit();UID=(await u.id())||'';AUTH=1;$('who').textContent=ADM?'Owner':'Employee';
 setTimeout(()=>{if(!LIVE){const e=$('sync');if(e){e.className='pill R';e.textContent='Offline · showing saved copy'}}},10000);
 const lis=(nm,q,fn,adm)=>{FN[nm]=fn;if(adm===true&&!ADM||adm==='emp'&&ADM)return;q.onSnapshot(s=>{if(!s.metadata.fromCache&&!LIVE){LIVE=true;stat()}if(!s.metadata.fromCache)LIVEN[nm]=true;const dd=s.docs.map(d=>({...d.data(),_id:d.id}));if(FAMS.includes(nm)){FD[nm].flat=dd;famMerge(nm);return}RAW[nm]=dd;fn(dd);if(nm=='seal')schedIntegrity();if(!dirty)render()},e=>{console.error(e);const x=$('sync');if(x){x.className='pill R';x.textContent='Sync error'}})};
 const cl=a=>a.map(({_id,...x})=>x);
 lis('closings',DB.collection('closings'),a=>{S.closings={};a.slice().sort((p,q)=>(p.at||0)-(q.at||0)).forEach(x=>{S.closings[x._id]=cl([x])[0]})},true);
 lis('products',DB.collection('products'),a=>{S.prod=cl(a).map(normP).sort((p,q)=>p.id<q.id?-1:1)},true);
 lis('catalog',DB.collection('catalog'),a=>{S.prod=cl(a).map(normP).sort((p,q)=>p.id<q.id?-1:1)},'emp');
 lis('demand',DB.collection('demand'),a=>{S.demand=cl(a)},true);
 lis('bills',DB.collection('bills'),a=>{S.bills=cl(a)},true);
 lis('stocklog',DB.collection('stocklog'),a=>{S.slogA=cl(a);S.slog=[...S.slogA,...(S.slogB||[])]},true);
 lis('salelog',DB.collection('salelog'),a=>{S.slogB=cl(a);S.slog=[...(S.slogA||[]),...S.slogB]},true);
 lis('purchases',DB.collection('purchases'),a=>{S.purch=cl(a)},true);
 lis('supay',DB.collection('supay'),a=>{S.spay=cl(a)},true);
 lis('roster',DB.collection('roster'),a=>{S.roster=cl(a)});
 lis('att',DB.collection('att'),a=>{S.att=cl(a)},true);
 lis('leaves',DB.collection('leaves'),a=>{S.leaves=cl(a)},true);
 lis('leavedec',DB.collection('leavedec'),a=>{S.ldec=cl(a)});
 lis('emp',DB.collection('emp'),a=>{S.emp=cl(a);ensureSubs()},true);
 lis('compl',DB.collection('compl'),a=>{S.compl=cl(a)},true);
 lis('salpay',DB.collection('salpay'),a=>{S.sal=cl(a)},true);
 lis('saladj',DB.collection('saladj'),a=>{S.sadj=cl(a)},true);
 lis('devs',DB.collection('devs'),a=>{S.devs=cl(a).filter(d=>typeof d.uid=='string'&&d.uid).map(d=>({...d,name:typeof d.name=='string'?d.name:''}));ensureSubs()},true);
 lis('ralert',DB.collection('ralert'),a=>{S.ral=cl(a)},true);
 lis('money',DB.collection('money'),a=>{S.money=cl(a)},true);
 lis('audit',DB.collection('audit'),a=>{S.audit=cl(a).sort((p,q)=>p.at-q.at)},true);
 lis('seal',DB.collection('seal'),a=>{SEAL=Object.fromEntries(a.map(x=>[x._id,x.m||{}]))},true);
 lis('selftest',DB.collection('selftest'),a=>{S.sts=cl(a).map(x=>({uid:String(x.uid||''),at:typeof x.at=='number'?x.at:0,ok:x.ok===true,fails:Array.isArray(x.fails)?x.fails.map(String):[],canary:!!x.canary,n:typeof x.n=='number'?x.n:0}))},true);
 ensureSubs();
 DB.doc('meta/settings').onSnapshot(s=>{if(s.exists){const v=s.data(),st=v.set||{};S.set={...S.set};Object.keys(st).forEach(k=>{if(PUBK.includes(k)||(ADM&&!HAVEPRIV))S.set[k]=st[k]});if(ADM&&!HAVEPRIV&&v.cats)S.cats=v.cats;if(ADM&&(Object.keys(st).some(k=>!PUBK.includes(k))||v.cats))LEGACY=true;if(!dirty)render()}},e=>console.error(e));
 if(ADM)DB.doc('cfg/private').onSnapshot(s=>{if(s.exists){const v=s.data();HAVEPRIV=true;S.set={...S.set,...(v.set||{})};S.cats=v.cats||[];if(!dirty)render()}if(!(s.metadata&&s.metadata.fromCache))CFGP=true},e=>console.error(e));
 if(!ADM){setTimeout(regAuto,3000);setTimeout(selfTest,6000)}else setTimeout(migrate,6000);
}catch(e){DB=null;AUTH=2;render()}}
const syncCard=()=>`<div class="card"><h2>Shared database</h2><div class="muted">${DB?'Connected as '+(ADM?'Owner':'Employee')+'. All devices read and write the same records; nothing is uploaded manually.':'Not connected.'}</div>${DB&&ADM?'<button class="s" style="margin-top:8px" onclick="syncCatalog()">Rebuild employee product list</button>':''}</div>`;

const inr=n=>'₹'+(Math.round(n)).toLocaleString('en-IN');
const today=()=>new Date().toISOString().slice(0,10);
const n=v=>parseFloat(v)||0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let role='owner',tab='dash',errMsg='';
const TABS={owner:[['dash','Dashboard'],['stock','Stock'],['purch','Purchase'],['money','Money'],['bill','Bill'],['dem','Demand'],['staff','Staff'],['set','Settings']],emp:[['me','My Day'],['bill','Bill'],['close','Closing'],['dem','Demand']]};
// ---- calculation engine ----
function calc(c){const total=c.st+c.xs+c.pr+c.cd+c.ot;const pay=c.cash+c.upi+c.op;const pd=pay-total;
 const copies=c.xc-c.xo;const exp=copies*S.set.xr;const xd=c.xa-exp;
 return{total,pay,pd,avg:c.cust>0?total/c.cust:0,copies,exp,xd,pst:Math.abs(pd)==0?'G':Math.abs(pd)>S.set.payT?'R':'Y',xst:Math.abs(xd)==0?'G':Math.abs(xd)>S.set.xT?'R':'Y'}}
function stockSt(p){return p.stock<=0?'R':p.stock<=p.min?'Y':'G'}
function demandAgg(days){const lim=Date.now()-days*864e5,m={};
 S.demand.filter(d=>new Date(d.date).getTime()>=lim).forEach(d=>{const k=d.pid||d.item.toLowerCase();m[k]=m[k]||{item:d.item,pid:d.pid,req:0};m[k].req+=d.req});
 return Object.values(m).sort((a,b)=>b.req-a.req)}
// ---- money module (owner only) ----
const MT={setup:'Shop Setup / Investment',opex:'Operating Expense',repair:'Repair & Maintenance',stock:'Stock / Inventory Purchase',emp:'Employee Related',mkt:'Marketing',gov:'Government / License',misc:'Miscellaneous'};
const CATS=['Rack','Counter','Hanger','Chair','Table','Light','Fan','Signboard','Paint','Electrical','Plumbing','Broom','Dustbin','Cleaning Material','Stationery','Packaging','Rent','Electricity','Internet','Repair','Transport','Salary','Marketing','License','Other'];
const PF=['Cash','UPI','Bank','Personal Money','Business Account','Credit'];
let mm={k:'exp',t:'opex'};
const tot=a=>a.reduce((s,e)=>s+e.amt,0);
const run=e=>e.k=='exp'&&e.t!='setup'&&e.t!='stock';
const ofT=(t,ms)=>S.money.filter(e=>e.k=='exp'&&e.t==t&&(!ms||e.d.slice(0,7)==ms));
const monthOf=ms=>S.money.filter(e=>run(e)&&e.d.slice(0,7)==ms);
function moneyCard(sales){const t=today(),td=S.money.filter(e=>e.d==t&&e.k=='exp'),m=t.slice(0,7);
 const x=tot(td.filter(run)),inv=tot(td.filter(e=>e.t=='setup')),pur=tot(td.filter(e=>e.t=='stock'))+puDay(t),pd=tot(td.filter(e=>e.t=='stock'))+payDay(t);
 return `<div class="card"><h2>Money control</h2><div class="row"><span>Today’s sales</span><b>${inr(sales)}</b></div><div class="row"><span>Today’s expenses</span><b>${inr(x)}</b></div><div class="row"><span>Today’s investment</span><b>${inr(inv)}</b></div><div class="row"><span>Today’s purchase</span><b>${inr(pur)}</b></div><div class="row"><span>Net cash movement</span><b>${inr(sales-x-inv-pd)}</b></div><div class="muted">Net cash movement counts cash actually paid to suppliers. It is not profit.</div><div class="row"><span>Supplier outstanding</span><b>${inr(supOut())}</b></div>
 <div class="row" style="margin-top:8px"><span>Total shop investment</span><b>${inr(tot(ofT('setup')))}</b></div><div class="row"><span>Monthly running expense</span><b>${inr(tot(monthOf(m)))}</b></div></div>`}
function money(){if(prf)return profitV();const t=today(),m=t.slice(0,7);let[y,mo]=m.split('-').map(Number);mo--;if(!mo){mo=12;y--}const pm=y+'-'+String(mo).padStart(2,'0');
 const cur=monthOf(m),prev=monthOf(pm),a=tot(cur),b=tot(prev);let cmp='';
 if(b>0){const ch=(a-b)/b*100;let best=null,bd=0;Object.keys(MT).forEach(k=>{if(k=='setup'||k=='stock')return;const dd=tot(cur.filter(e=>e.t==k))-tot(prev.filter(e=>e.t==k));if(Math.abs(dd)>Math.abs(bd)){bd=dd;best=k}});
  cmp=`<div class="row"><span>${pm}</span><b>${inr(b)}</b></div><div class="row"><span>${m}</span><b>${inr(a)}</b></div><div class="row"><span>Change</span><span class="pill ${ch>0?'Y':'G'}">${ch>0?'↑':'↓'} ${Math.abs(ch).toFixed(1)}%</span></div>`+(best?`<div class="muted">Mainly ${inr(Math.abs(bd))} ${bd>0?'more':'less'} on ${MT[best]}.</div>`:'')}
 const isE=mm.k=='exp',title=isE?'Add · '+MT[mm.t]:mm.k=='cap'?'Add owner money':'Add owner withdrawal';
 const dl=`<datalist id="cl">${[...CATS,...S.cats].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;
 const qb=[['+ Expense','exp','opex'],['+ Investment','exp','setup'],['+ Purchase','buy'],['+ Owner money','cap'],['+ Withdrawal','wd']].map(q=>`<button class="s" onclick="${q[1]=='buy'?"tab='purch';pu={v:'new'};render()":`mm={k:'${q[1]}',t:'${q[2]||''}'};render()`}">${q[0]}</button>`).join('');
 let h=`<div class="card"><h2>Quick add</h2><div class="qb">${qb}<button class="s" style="grid-column:1/-1" onclick="prf=true;render();scrollTo(0,0)">Profit report</button></div></div><div class="card"><h2>${title}</h2>${dl}
 <div class="g2"><div><label for="m_d">Date</label><input id="m_d" type="date" value="${t}"></div><div><label for="m_a">Amount (₹)</label><input id="m_a" type="number" inputmode="decimal" min="0"></div></div>`;
 const stk=`<div id="stk" style="display:${mm.t=='stock'?'block':'none'}"><label for="m_pid">Add to inventory (optional)</label><select class="f" id="m_pid"><option value="">Do not add to stock</option>${S.prod.filter(p=>p.active!==false).map(p=>`<option value="${p.id}">${esc(p.name)} (now ${p.stock})</option>`).join('')}<option value="new">+ New product (name from item)</option></select><label for="m_mn">Minimum stock (new product only)</label><input id="m_mn" type="number" min="0" value="5"></div>`;
 const ph=`<label for="m_ph">Photo of bill (optional)</label><input id="m_ph" type="file" accept="image/*">`;
 if(isE)h+=`<label for="m_t">Expense type</label><select class="f" id="m_t" onchange="$('stk').style.display=this.value=='stock'?'block':'none'">${Object.keys(MT).map(k=>`<option value="${k}" ${k==mm.t?'selected':''}>${MT[k]}</option>`).join('')}</select>
 <label for="m_c">Category (pick or type a new one)</label><input id="m_c" list="cl"><label for="m_ds">Item / description</label><input id="m_ds">
 <div class="g2"><div><label for="m_v">Vendor / shop</label><input id="m_v"></div><div><label for="m_q">Quantity</label><input id="m_q" type="number" min="0" value="1"></div></div>
 <div class="g2"><div><label for="m_p">Paid from</label><select class="f" id="m_p">${PF.map(p=>`<option>${p}</option>`).join('')}</select></div><div><label for="m_b">Bill / invoice no.</label><input id="m_b"></div></div>${stk}${ph}`;
 if(!isE)h+=`<label for="m_p">${mm.k=='cap'?'Received as':'Taken from'}</label><select class="f" id="m_p">${['Cash','UPI','Bank'].map(p=>`<option>${p}</option>`).join('')}</select>`;
 h+=`<label for="m_n">Notes</label><input id="m_n"><div class="err" id="er"></div><button class="p" onclick="addMoney()">Save entry</button></div>`;
 h+=`<div class="card"><h2>Running expenses · ${m}</h2>`+Object.keys(MT).map(k=>[k,tot(ofT(k,m))]).filter(x=>x[1]>0).map(x=>`<div class="row"><span>${MT[x[0]]}${x[0]=='setup'||x[0]=='stock'?' <span class="muted">(not in running total)</span>':''}</span><b>${inr(x[1])}</b></div>`).join('')+`<div class="row"><span><b>Total running</b></span><b>${inr(a)}</b></div>${cmp}</div>`;
 const g={};ofT('setup').forEach(e=>{const k=e.cat||e.desc;g[k]=(g[k]||0)+e.amt});
 h+=`<div class="card"><h2>Shop setup investment</h2>`+(Object.keys(g).length?Object.keys(g).map(k=>`<div class="row"><span>${esc(k)}</span><b>${inr(g[k])}</b></div>`).join('')+`<div class="row"><span><b>Total</b></span><b>${inr(tot(ofT('setup')))}</b></div>`:'<div class="muted">No setup items yet. Use + Investment for rack, counter, signboard and so on.</div>')+'</div>';
 const inv=tot(S.money.filter(e=>e.k=='cap'))+tot(S.money.filter(e=>e.k=='exp'&&e.pf=='Personal Money'))+tot(livePay().filter(y=>y.pm=='Personal Money'));
 h+=`<div class="card"><h2>Owner capital</h2><div class="row"><span>Owner invested</span><b>${inr(inv)}</b></div><div class="muted">Owner money added plus anything paid from Personal Money.</div><div class="row"><span>Shop setup</span><b>${inr(tot(ofT('setup')))}</b></div><div class="row"><span>Operating expenses (all time)</span><b>${inr(tot(S.money.filter(run)))}</b></div><div class="row"><span>Stock purchased</span><b>${inr(tot(ofT('stock'))+sumB(S.purch.filter(u=>!u.void)))}</b></div><div class="row"><span>Owner withdrawals</span><b>${inr(tot(S.money.filter(e=>e.k=='wd')))}</b></div></div>`;
 const L=S.money.slice().sort((p,q)=>p.d<q.d?1:p.d>q.d?-1:q.id.localeCompare(p.id)).slice(0,15);
 h+=`<div class="card"><h2>Recent entries</h2>`+(L.length?L.map(e=>`<div class="row"><span>${esc(e.k=='exp'?(e.cat||e.desc):e.k=='cap'?'Owner money in':'Owner withdrawal')}<br><span class="muted">${e.d}${e.k=='exp'?' · '+MT[e.t]+' · '+e.pf:''}</span></span><span>${e.photo?`<img class="th" src="/_blob/${e.photo}" alt="Bill" onclick="this.classList.toggle('bg')">`:''}<b>${inr(e.amt)}</b> <button class="s" onclick="delMoney('${e.id}')">Delete</button></span></div>`).join(''):'<div class="muted">No entries yet.</div>')+'</div>';

 <div class="row"><span>Customers</span><b>${c.cust}</b></div><div class="row"><span>Avg per customer</span><b>${inr(r.avg)}</b></div>
 <div class="row"><span>Cash</span><b>${inr(c.cash)}</b></div><div class="row"><span>UPI</span><b>${inr(c.upi)}</b></div>
 <div class="row"><span>Sales vs payments difference</span><span class="pill ${r.pst}">${inr(r.pd)}</span></div></div>
 <div class="card"><h2>Xerox</h2><div class="row"><span>Copies</span><b>${r.copies}</b></div><div class="row"><span>Expected</span><b>${inr(r.exp)}</b></div><div class="row"><span>Reported</span><b>${inr(c.xa)}</b></div>
 <div class="row"><span>Difference</span><span class="pill ${r.xst}">${inr(r.xd)} ${r.xst=='G'?'Match':'Mismatch'}</span></div></div>`;
 h+=actCard();h+=drawCard();h+=moneyCard(c?r.total:0);
 const cnt={R:0,Y:0,G:0};S.prod.filter(p=>p.active!==false).forEach(p=>cnt[stockSt(p)]++);
 h+=`<div class="card"><h2>Stock</h2><div class="row"><span>Out of stock</span><span class="pill R">${cnt.R}</span></div><div class="row"><span>Low stock</span><span class="pill Y">${cnt.Y}</span></div><div class="row"><span>Normal</span><span class="pill G">${cnt.G}</span></div></div>`;
 const days=Object.keys(S.closings).sort().slice(-7);
 if(days.length){const tot=days.reduce((a,d)=>a+calc(S.closings[d]).total,0),cu=days.reduce((a,d)=>a+S.closings[d].cust,0);
  h+=`<div class="card"><h2>Last ${days.length} closing days</h2><div class="row"><span>Total sales</span><b>${inr(tot)}</b></div><div class="row"><span>Average per day</span><b>${inr(tot/days.length)}</b></div><div class="row"><span>Customers</span><b>${cu}</b></div><div class="row"><span>Average per customer</span><b>${cu?inr(tot/cu):'–'}</b></div></div>`}
 return h}
function closing(){const c=S.closings[today()]||{};const f=(id,l,v)=>`<div><label for="${id}">${l}</label><input id="${id}" type="number" inputmode="decimal" min="0" value="${v??''}" oninput="live()"></div>`;
 return `<div class="card"><h2>Daily closing · ${today()}</h2>${c.at?`<div class="muted">Already submitted at ${new Date(c.at).toLocaleTimeString()}. Saving again replaces it and is logged.</div>`:''}
 ${f('cust','Customer visits',c.cust)}<h2 style="margin-top:16px">Sales (₹)</h2><div class="g2">${f('st','Stationery',c.st)}${f('xs','Xerox',c.xs)}${f('pr','Printing/services',c.pr)}${f('cd','Cold/dairy',c.cd)}${f('ot','Other',c.ot)}</div>
 <h2 style="margin-top:16px">Payments received (₹)</h2><div class="g2">${f('cash','Cash',c.cash)}${f('upi','UPI',c.upi)}${f('op','Other',c.op)}</div>${f('ctd','Cash counted in drawer after closing (₹)',c.ctd)}<div class="muted">Count the physical cash. The owner’s dashboard compares it with the expected cash.</div>
 <h2 style="margin-top:16px">Xerox counter</h2><div class="g2">${f('xo','Opening',c.xo)}${f('xc','Closing',c.xc)}</div>${f('xa','Xerox sales reported (₹)',c.xa)}
 <label for="prob">Problems (optional)</label><textarea id="prob" rows="2">${esc(c.prob||'')}</textarea>
 <label><input type="checkbox" id="cc" style="width:auto"> Closing cash counted and shop closed</label>
 <div class="calc" id="lv"></div><div class="err" id="er"></div><button class="p" onclick="submitClose()">Submit closing</button></div>`}
function readC(){const g=id=>n($(id).value);return{cust:g('cust'),st:g('st'),xs:g('xs'),pr:g('pr'),cd:g('cd'),ot:g('ot'),cash:g('cash'),upi:g('upi'),op:g('op'),ctd:$('ctd').value===''?null:g('ctd'),xo:g('xo'),xc:g('xc'),xa:g('xa'),prob:$('prob').value.trim()}}
function live(){if(!$('lv'))return;const c=readC(),r=calc(c);
 $('lv').innerHTML=`<div class="row"><span>Total sales</span><b>${inr(r.total)}</b></div><div class="row"><span>Payment total</span><b>${inr(r.pay)}</b></div><div class="row"><span>Sales vs payments difference</span><span class="pill ${r.pst}">${inr(r.pd)}</span></div><div class="row"><span>Copies</span><b>${r.copies}</b></div><div class="row"><span>Xerox expected</span><b>${inr(r.exp)}</b></div><div class="row"><span>Xerox difference</span><span class="pill ${r.xst}">${inr(r.xd)}</span></div>`}
function submitClose(){if(busy('submitClose'+arguments[0]))return;const c=readC(),e=[];
 ['cust','st','xs','pr','cd','ot','cash','upi','op','xo','xc','xa'].forEach(k=>{if(c[k]<0)e.push('Values cannot be negative.')});
 if(c.ctd==null)e.push('Enter the counted cash in the drawer.');
 if(c.xc<c.xo)e.push('Xerox closing counter cannot be below opening.');
 if(!$('cc').checked)e.push('Confirm cash is counted and the shop is closed.');
 if(e.length){$('er').textContent=[...new Set(e)].join(' ');return}
 const old=S.closings[today()];if(old&&!confirm('A closing report was already submitted at '+hm(old.at)+'. Replace it?'))return;c.at=Date.now();c.by=WHO();c.id='CL'+today().replace(/-/g,'');
 S.closings[today()]=c;S.audit=(S.audit||[]);S.audit.push({at:c.at,who:c.by,what:(old?'Closing replaced':'Closing submitted'),date:today()});
 save();c.u=UID;c.d=today();put('closings/'+UID+'/r/'+today(),c);if(ADM)put('audit/A'+c.at,S.audit[S.audit.length-1]);errMsg='';tab=role=='owner'?'dash':'close';render();alert('Daily closing saved.')}
function dem(){const a30=demandAgg(30),a7=demandAgg(7);
 let h=`<div class="card"><h2>Log customer demand</h2><label for="di">Item requested (pick a product or type any item)</label><input id="di" list="bl" autocomplete="off"><datalist id="bl">${S.prod.filter(isAct).map(p=>`<option value="${esc(p.name)}">${esc(p.code||'')}</option>`).join('')}</datalist><div class="g2"><div><label for="dr">Customers asked</label><input id="dr" type="number" min="1" value="1"></div><div><label for="dq">Approx quantity</label><input id="dq" type="number" min="0"></div></div><div class="err" id="er"></div><button class="p" onclick="addDem()">Save request</button></div>`;
 h+=`<div class="card"><h2>Requests, last 30 days</h2>`+(a30.length?a30.map(d=>{const s=d.req>=S.set.dem2?'R':d.req>=S.set.dem1?'Y':'G';const w=a7.find(x=>x.item.toLowerCase()==d.item.toLowerCase());return `<div class="row"><span>${esc(d.item)}<br><span class="muted">7 days: ${w?w.req:0}</span></span><span class="pill ${s}">${d.req}${s=='R'?' High demand':s=='Y'?' Consider stocking':''}</span></div>`}).join(''):'<div class="muted">No requests logged yet.</div>')+'</div>';return h}
function addDem(){if(busy('addDem'+arguments[0]))return;const it=$('di').value.trim(),r=n($('dr').value);if(!it){$('er').textContent='Enter the item name.';return}if(r<1){$('er').textContent='Customer count must be at least 1.';return}
 const pm=bfind(it),o={id:'D'+Date.now(),date:today(),item:pm?pm.name:it,pid:pm?pm.id:undefined,req:r,qty:n($('dq').value),by:role,who:WHO()};o.u=UID;S.demand.push(o);save();put('demand/'+UID+'/r/'+o.id,o);render()}
function sett(){if(av)return auditV();const f=(k,l,t='number')=>`<label for="s_${k}">${l}</label><input id="s_${k}" type="${t}" min="0" value="${S.set[k]}">`;
 return `<div class="card"><h2>Settings</h2>${f('name','Shop name','text')}${f('xr','Xerox rate per copy (₹)')}${f('payT','Payment mismatch red above (₹)')}${f('xT','Xerox mismatch red above (₹)')}${f('dem1','Demand: consider stocking at (30 days)')}${f('dem2','Demand: high priority at (30 days)')}${f('waMin','WhatsApp bill minimum (₹)')}${f('cash0','Opening cash in drawer, first day (₹)')}${f('cashT','Cash variance red above (₹)')}${f('v1','Stock variance medium from (₹)')}${f('v2','Stock variance high from (₹)')}${f('expD','Expiry alert days (batch-tracked items)')}${f('open','Shop opening time','time')}${f('close','Closing time','time')}${f('grace','Late / early grace (minutes)')}${f('lateN','Late marks per half-day deduction (0 = off)')}${f('demT','Demand entries expected per present day')}${f('inc1','Incentive 100% at control score from')}${f('inc2','Incentive 60% at control score from')}${f('inc3','Incentive 30% at control score from')}${f('prT','Purchase-rate rise alert from (%)')}${f('spT','Unusual sale-price change from (%)')}${f('slowD','Slow stock after (days without sale)')}${f('deadD','Dead stock after (days without sale)')}<div class="err" id="er"></div><button class="p" onclick="saveSet()">Save settings</button></div>
 ${secCard()}${bkCard()}${syncCard()}<div class="card"><h2>Audit log</h2>${(S.audit||[]).slice(-8).reverse().map(a=>`<div class="row"><span>${esc(a.what)}</span><span class="muted">${new Date(a.at).toLocaleString()}</span></div>`).join('')||'<div class="muted">No actions logged yet.</div>'}</div>`}
function saveSet(){if(busy('saveSet'+arguments[0]))return;const s=S.set;['name','close','open'].forEach(k=>s[k]=$('s_'+k).value);['xr','payT','xT','dem1','dem2','waMin','cash0','cashT','v1','v2','expD','grace','lateN','demT','inc1','inc2','inc3','prT','spT','slowD','deadD'].forEach(k=>s[k]=n($('s_'+k).value));
 S.audit=S.audit||[];const au={at:Date.now(),who:'OWNER',what:'Settings changed'};S.audit.push(au);save();saveCfg();put('audit/A'+au.at,au);render();}
function render(){if(AUTH!=1){$('nav').innerHTML='';$('v').innerHTML=AUTH==2?'<div class="card"><h2>Sign-in required</h2><div class="muted">Open this page while signed in to Claude. If you are, ask the owner to share it with you as a Contributor.</div></div>':'<div class="card"><div class="muted">Connecting…</div></div>';return}
 recalc();role=ADM?'owner':'emp';if(!TABS[role].some(t=>t[0]==tab))tab=TABS[role][0][0];
 $('shop').textContent=S.set.name;
 $('nav').innerHTML=TABS[role].map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
 $('v').innerHTML={dash,stock:stockV,purch:purchV,staff:staffV,me:meV,money,bill,dem,set:sett,close:closing}[tab]();live();blive();if($('pu_t'))pulive();dirty=false}

$('v').addEventListener('input',()=>{dirty=true});
render();connect();
</script></body></html>
